<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Harsh Patel</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a12">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a12'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='%239d8cff' text-anchor='middle'%3EHP%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0a12;
            --text: #f3f3f8;
            --text-2: #b9bacb;
            --text-3: #8d8fa5;
            --stroke: rgba(255, 255, 255, 0.1);
            --stroke-2: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            background:
                radial-gradient(42rem 30rem at 8% -6%, rgba(139, 108, 255, 0.22), transparent 70%),
                radial-gradient(38rem 32rem at 100% 18%, rgba(79, 140, 255, 0.16), transparent 70%),
                radial-gradient(36rem 28rem at 60% 110%, rgba(255, 122, 217, 0.12), transparent 70%),
                var(--bg);
            color: var(--text-2);
            font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: rgba(169, 184, 255, 0.35);
            color: #fff;
        }

        .card {
            width: min(34rem, 100%);
            padding: clamp(2rem, 6vw, 3rem);
            border-radius: 28px;
            border: 1px solid var(--stroke);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            text-align: center;
        }

        .code {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            height: 2rem;
            padding: 0 0.85rem;
            border-radius: 999px;
            border: 1px solid var(--stroke-2);
            color: var(--text-3);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.8rem;
        }

        .code i {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: #9d8cff;
        }

        h1 {
            margin-top: 1.25rem;
            color: var(--text);
            font-family: 'Sora', ui-sans-serif, sans-serif;
            font-size: clamp(2rem, 6vw, 2.75rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: #9d8cff;
        }

        p {
            margin-top: 1rem;
            font-size: 1.05rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            height: 3rem;
            padding: 0 1.4rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .primary {
            background: #6d5cf0;
            color: #fff;
        }

        .primary:hover {
            background: #5f4de3;
        }

        .ghost {
            border: 1px solid var(--stroke-2);
            color: var(--text);
        }

        .ghost:hover {
            border-color: rgba(157, 140, 255, 0.55);
            background: rgba(109, 92, 240, 0.18);
        }

        a:focus-visible {
            outline: 2px solid #a9b8ff;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main class="card">
        <span class="code"><i></i>404 · page not found</span>
        <h1>This page <span>wasn't retrieved</span>.</h1>
        <p>The link may be old or mistyped. Everything I build is on the home page.</p>
        <div class="actions">
            <a class="primary" href="./">Back to home</a>
            <a class="ghost" href="./#work">See my work</a>
        </div>
    </main>
</body>

</html>
